# CastleRAG — Snellius config with every derived artifact in the project space.
#
# Same cameras and endpoints as configs/snellius_fixedcams.yaml, but chunks,
# frames, embedding caches, Qdrant storage and outputs live in
# /projects/prjs2298 (2 TiB, no purge) instead of /scratch-shared (14-day
# purge). The raw video stays on scratch (`dataset.root`): it can be downloaded
# again. Switch to this config only after the artifacts have been moved; see
# docs/ingest_all_days.md, "Move to the project space".
dataset:
  root: "/scratch-shared/$USER/castle2024"
  hf_repo: "CASTLE-Dataset/CASTLE2024"
  ego_cameras: ["Allie", "Bao", "Bjorn", "Cathal", "Florian", "Klaus", "Luca", "Onanong", "Stevan", "Tien", "Werner"]
  exo_cameras: ["Kitchen", "Living1", "Living2", "Meeting", "Reading"]
  camera_scope: "all"
preprocessing:
  frames_dir:    "/projects/prjs2298/castle_derived/frames_1fps"
  clips_dir:     "/projects/prjs2298/castle_derived/clips"
  manifests_dir: "/projects/prjs2298/castle_derived/manifests"
  chunks_dir:    "/projects/prjs2298/castle_derived/chunks"
  # Chunks and Qdrant payloads written during the scratch-era ingest store
  # scratch frame paths; resolve them to the moved copies.
  frame_path_aliases:
    "/scratch-shared/$USER/castle_derived/frames_1fps": "/projects/prjs2298/castle_derived/frames_1fps"
embedding:
  cache_dir: "/projects/prjs2298/castle_derived/embeddings"
  base_url: "http://localhost:8200/v1"
qdrant:
  host: "localhost"
  port: 6333
  storage_path: "/projects/prjs2298/qdrant_storage"
outputs:
  dir:             "/projects/prjs2298/castle_outputs"
  predictions:     "/projects/prjs2298/castle_outputs/predictions.json"
  evidence_traces: "/projects/prjs2298/castle_outputs/evidence_traces.jsonl"
  submissions:     "/projects/prjs2298/castle_outputs/submissions.json"
  metrics:         "/projects/prjs2298/castle_outputs/metrics.json"
